openapi: 3.1.0
info:
  version: 1.0.0
  title: Petstore - OpenAPI 3.1
paths:
  /pets:
    get:
      operationId: listPets
      responses:
        '200':
          description: A list of pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Pet'
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PetInput'
      responses:
        '201':
          description: Pet created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
  /pets/{petId}:
    get:
      operationId: getPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: A pet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pet'
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string
        tag:
          type:
            - string
            - "null"
        age:
          type:
            - integer
            - "null"
        weight:
          type:
            - number
            - "null"
        aliases:
          type:
            - array
            - "null"
          items:
            type: string
        metadata:
          type:
            - object
            - "null"
          properties:
            source:
              type: string
        code:
          type:
            - integer
            - string
    PetInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        tag:
          type:
            - string
            - "null"
        age:
          type:
            - integer
            - "null"
        code:
          type:
            - integer
            - string
